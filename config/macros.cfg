[gcode_macro TESTHOME]
gcode:
    M118 {printer.toolhead.homed_axes}
    
[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    {% if printer.quad_gantry_level.applied == False %}
      _QUAD_GANTRY_LEVEL {% for p in params
              %}{'%s=%s ' % (p, params[p])}{%
              endfor %}
    {% endif %}
    
[gcode_macro CG28]
gcode:
    TESTHOME
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    
[gcode_macro G32]
gcode:
    TESTHOME
    SAVE_GCODE_STATE NAME=STATE_G32
    BED_MESH_CLEAR
    {% if "xyz" not in printer.toolhead.homed_axes %}
      STATUS_HOMING
      M117 Homing...
      CG28
    {% endif %}

    # STATUS_CLEANING
    # # CLEAN_NOZZLE

    STATUS_LEVELING
    M117 Leveling Gantry ...
    QUAD_GANTRY_LEVEL

    # STATUS_CLEANING
    # # CLEAN_NOZZLE

    G28 Z
    
    # STATUS_CALIBRATING_Z
    # CALIBRATE_Z
     
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z20 F10000  ; Center position for 350x350
    STATUS_READY
    RESTORE_GCODE_STATE NAME=STATE_G32
    
[gcode_macro MESH_LOAD]
gcode:
    BED_MESH_PROFILE LOAD=default

[gcode_macro PRIME_LINE]
gcode: 
    M117 Prime Line
    G92 E0 ;Reset Extruder
    # move z axis 
    G1 X15 Y15 Z2.0 F3000 ;Move Z Axis up
    # move to prime position 
    G1 X15 Y15 Z0.28 F5000.0 ;Move to start position
    G1 X15 Y330.0 Z0.28 F1500.0 E15 ;Draw the first line (extended for 350mm build)
    G1 X19 Y330.0 Z0.28 F5000.0 ;Move to side a little
    G1 X19 Y50 Z0.28 F1500.0 E30 ;Draw the second line
    G92 E0 ;Reset Extruder
    G1 Z2.0 F3000 ;Move Z Axis up

[gcode_macro PRINT_START_VARS]
variable_tool: -1
gcode:

[gcode_macro PRINT_START]
gcode:
    {% set CHAMBER = params.CHAMBER|default(0)|int %}
    {% set BED = params.BED|default(100)|int %}
    {% set EXTRUDER = params.EXTRUDER|default(250)|int %}
    M118 Preheating to {EXTRUDER} / {BED} / {CHAMBER}
    SAVE_GCODE_STATE NAME=start

    STATUS_HEATING
    M117 Preheating...
    # M104 and M109 – Extruder Heating Commands
    M109 S150  ;Start Heating nozzle to 150 in order to use TAP!!
    # M140 and M190 – Bed Heating Commands
    M140 S{BED}  ;Start Heating the bed to the temperature.

    # {% if printer.toolhead.homed_axes != "xyz" %}
      G32
      # M117 Homing
      # STATUS_HOMING
      # G28
    # {% endif %}
    ;Heats the nozzle to 150 in order to use TAP
    
    STATUS_HEATING
    M117 Preheating to {EXTRUDER} / {BED} / {CHAMBER}
    # {% if printer['temperature_sensor Chamber'].temperature < params.CHAMBER|float - 1 %}
    #   M140 S125
    #   M191 S{CHAMBER|float - 1}
    # {% endif %}
    M104 S{EXTRUDER}    ;Start Heating nozzle
    M190 S{BED}         ;Waits for the bed to reach temperature before running any other commands
    M109 S{EXTRUDER}    ;Wait for nozzle to to reach temperature before running any other commands

    STATUS_CLEANING
    CLEAN_NOZZLE

    M117 Printing
    BED_MESH_PROFILE LOAD=default
    SKEW_PROFILE LOAD=default
    
    PRIME_LINE
    status_printing
    
    M117
    G90     
    RESTORE_GCODE_STATE NAME=start
 
[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
# safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5 F1000                ; park filament
    G91                            ; relative positioning
    # G0 Z1.00 X20.0 Y20.0 F20000  ; move nozzle to remove stringing
    G0 Z2 F20000            ; move nozzle to remove stringing

    
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G1 Z10 F3000                   ; move nozzle up 20mm
    G90                            ; absolute positioning
    G0 X5 Y345 F3600              ; park nozzle at rear left (safe for 350x350)
    G1 E-40 F2000                ; park filament
    BED_MESH_CLEAR
    SET_SKEW CLEAR=1
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END

