[gcode_macro OFF]
gcode:
    M84                                  ; turn steppers off
    TURN_OFF_HEATERS                     ; turn bed / hotend off
    M107                                 ; turn print cooling fan off
    #SET_FAN_SPEED FAN=Exhaust SPEED=0   ; turn exhaust fan off
    #SET_FAN_SPEED FAN=BedFans SPEED=0   ; bed fan off
    SET_PIN PIN=caselight VALUE=0       ; turn case light off

# Park front center
[gcode_macro PARKFRONT]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                           ; home if not already homed
    {% endif %}
    SAVE_GCODE_STATE NAME=PARKFRONT
    G90                               ; absolute positioning
    # G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} Z{printer.toolhead.axis_maximum.z/2} F6000    
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} Z20 F6000                                     
    RESTORE_GCODE_STATE NAME=PARKFRONT

# Park 15mm above center of bed
[gcode_macro PARKBED]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                           ; home if not already homed
    {% endif %}
    SAVE_GCODE_STATE NAME=PARKBED
    G90                                ; absolute positioning
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z15 F6000                                     
    RESTORE_GCODE_STATE NAME=PARKBED

#    use nozzle_clean to clean nozzle
#    must change to work for your brush loc
[gcode_macro CLEAN_NOZZLE]
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    { action_raise_error("Please home your axes!") }
    RETURN
  {% endif %}

  {% if printer.extruder.temperature < 200 %}
    M117 Nozzle too cold to clean
    RETURN
  {% endif %}

  M117 Cleaning nozzle

  # --- HARD SAFETY: lock extruder state ---
  M83            ; relative extrusion
  G92 E0         ; zero extruder to avoid jumps

  SAVE_GCODE_STATE NAME=clean_nozzle

  {% set x_brush = printer.toolhead.axis_minimum.x + 30 %}
  {% set x_wipe = printer.toolhead.axis_minimum.x + 5 %}
  {% set y_brush = printer.toolhead.axis_minimum.y + 4 %}
  {% set y_wipe = printer.toolhead.axis_minimum.y + 5 %}
  {% set y_stage = printer.toolhead.axis_minimum.y + 34 %}

  # --- move to brush BEFORE any ooze ---
  G90
  G0 Z15 F10000
  G0 X{x_brush} Y{y_stage} F10000   ; fixed staging point (consistent approach distance)
  G0 X{x_brush} Y{y_brush} F3000    ; extreme left-front brush position - fixed 30mm approach
  G0 Z11 F6000

  # --- controlled purge ON the brush ---
  G1 E50 F300             ; purge amount
  G92 E0

  # --- wipe motion ---
  SAVE_GCODE_STATE NAME=clean_nozzle_wipe

  {% for i in range(6) %}
    G0 X{x_brush + 25} Y{y_brush} F10000
    G0 X{x_wipe} Y{y_wipe} F10000
  {% endfor %}

  RESTORE_GCODE_STATE NAME=clean_nozzle_wipe MOVE=1

  # --- retract slightly to stop ooze ---
  G1 E-1.5 F1200
  G92 E0

  RESTORE_GCODE_STATE NAME=clean_nozzle   ; restore modal state only, stay at brush - PRIME_LINE handles the next move

  M117 Cleaned!

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set z = params.Z|default(10)|int %}                                                   ; z hop amount

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                              ; set z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}    ; set hotend temp variable for reference in resume macro

        # SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0                                  ; disable filament sensor
        SAVE_GCODE_STATE NAME=PAUSE                                                          ; save current print position for resume
        BASE_PAUSE                                                                           ; pause print
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       ; check that zhop doesn't exceed z max
            G91                                                                              ; relative positioning
            G1 Z{z} F900                                                                     ; raise Z up by z hop amount
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }                  ; if z max is exceeded, show message and set zhop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90                                                                                  ; absolute positioning
        G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} F6000   ; park toolhead at front center
        SAVE_GCODE_STATE NAME=PAUSEPARK                                                      ; save parked position in case toolhead is moved during the pause (otherwise the return zhop can error)
        # M104 S0                                                                              ; turn off hotend
        SET_IDLE_TIMEOUT TIMEOUT=43200                                                       ; set timeout to 12 hours
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    # Parameters
    {% set e = params.E|default(2.5)|float %}                                        ; hotend prime amount (in mm)

    {% if printer['pause_resume'].is_paused|int == 1 %}
        # SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1                          ; enable filament sensor
        #INITIAL_RGB                                                                    ; reset LCD color
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  ; set timeout back to configured value
        {% if etemp > 0 %}
            M109 S{etemp|int}                                                        ; wait for hotend to heat back up
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                     ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
        G91                                                                          ; relative positioning
        M83                                                                          ; relative extruder positioning
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 Z{zhop * -1} E{e} F900                                                ; prime nozzle by E, lower Z back down
        {% else %}
            G1 Z{zhop * -1} F900                                                     ; lower Z back down without priming (just in case we are testing the macro with cold hotend)
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                          ; restore position
        BASE_RESUME                                                                  ; resume print
    {% endif %}

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout} ; set timeout back to configured value
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    PRINT_END
    BASE_CANCEL_PRINT

[gcode_macro M600]
gcode:
    # LCDRGB R=0 G=1 B=0  ; Turn LCD green
    PAUSE                ; Pause

[gcode_macro FILAMENT_CHANGE]
gcode:
    PAUSE                ; Pause
    UNLOAD_FILAMENT

#   Load Filament (Afterburner)
[gcode_macro LOAD_FILAMENT]
gcode:
  M83                            ; set extruder to relative
  G1 E30 F1800                   ; quickly load 30mm filament
  G1 E50 F300                    ; slower extrusion for hotend path
  G1 E10 F150                    ; prime nozzle with filament
  M82                            ; set extruder to absolute

#   Remove Filament (Afterburner)
[gcode_macro UNLOAD_FILAMENT]
gcode:
  M83                            ; set extruder to relative
  G1 E5 F300                     ; extrude a little to soften tip
  G1 E-100 F1800                 ; retract filament completely
  M82                            ; set extruder to absolute


[gcode_macro M109]
rename_existing: M99109
gcode:
    #Parameters
    {% set s = params.S|float %}
    
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}   ; Wait for hotend temp (within 1 degree)
    {% endif %}

[gcode_macro M190]
rename_existing: M99190
gcode:
    #Parameters
    {% set s = params.S|float %}

    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   ; Set bed temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s} MAXIMUM={s+1}  ; Wait for bed temp (within 1 degree)
    {% endif %}

[gcode_macro SHUTDOWN]
gcode:
    OFF                                              ; Shortcut to turn everything off (see above for this macro)
    # {action_respond_info('action:poweroff')}          ; OctoPrint compatible host shutdown
	{action_call_remote_method("shutdown_machine")}   ; Moonraker compatible host shutdown


# ignore m150 commands
[gcode_macro M150]
gcode:

[gcode_macro M191]
gcode:
    {% set S = params.S|default(0) %}
    {% set R = params.R|default(120) %}
    TEMPERATURE_WAIT SENSOR="temperature_sensor Chamber" MINIMUM={S} MAXIMUM={R}

[idle_timeout]
gcode:
    {% if not printer.pause_resume.is_paused %}
      TURN_OFF_HEATERS
      M84
      STATUS_OFF
      SET_PIN PIN=caselight VALUE=0.00
    {% endif %}


## Use:
##   - DUMP_WARNINGS
[gcode_macro DUMP_WARNINGS]
description: Debug: Print all warning messages from klipper
gcode:
  {% if not printer.configfile.warnings %}
    {action_respond_info("klipper too old! Please update klipper first and run again")}
  {% else %}
    {% set parameters = ["printer.configfile.warnings:"] %}
    {% for warning in printer.configfile.warnings %}
      {% set parameters = parameters.append("%s -> %s -> %s\n%s" % (warning.type, warning.section, warning.option, warning.message)) %}
    {% endfor %}
    {action_respond_info(parameters|join("\n"))}
  {% endif %}

# [output_pin beeper]
# ## PE8 for Octopus/Octopuspron or PC9 for spider1/2.2 Boards
# #pin: PC9
# pin: PE8
# pwm: True
# value: 0
# shutdown_value: 0
# cycle_time: 0.001 #   Default PWM frequency : 0.001 = 1ms will give a tone of 1kHz


# [gcode_macro M300]
# gcode:
# 	{% set S = params.S|default(1000)|int %}
# 	{% set P = params.P|default(100)|int %}

# 		SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={ 1.0/S if S > 0 else 1 }
# 		G4 P{P}
# 		SET_PIN PIN=beeper VALUE=0

