[tmc5160 stepper_x]
cs_pin: PC4
# Using software SPI to bypass hardware bus conflicts
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
# Slowing down significantly for 48V noise suppression
# spi_speed: 100000 
run_current: 0.800
sense_resistor: 0.075
stealthchop_threshold: 0
# Force the driver to stay awake
interpolate: True

